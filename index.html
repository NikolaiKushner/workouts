<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nik's Workouts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column for a phone in the gym — language switch and day tabs on top, exercise rows with set checkboxes below */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1d2124; --muted:#5f676c; --line:#dfe2df;
  --accent:#d9541e; --accent-soft:#fbe6dc; --done:#2f7d4f; --done-soft:#e1f1e6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --surface:#1d2124; --fg:#eceeec; --muted:#9aa2a6; --line:#2e3438;
  --accent:#f0743f; --accent-soft:#3a2219; --done:#5cc184; --done-soft:#1b3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1d2124; --fg:#eceeec; --muted:#9aa2a6; --line:#2e3438;
  --accent:#f0743f; --accent-soft:#3a2219; --done:#5cc184; --done-soft:#1b3326; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header > div{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:7px 11px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{font-family:var(--display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 4px;cursor:pointer;line-height:1.1}
.tab small{display:block;font-family:var(--body);font-weight:500;font-size:11px;text-transform:none;letter-spacing:0;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.mode label{flex:1;min-width:0;font-size:14px;cursor:pointer}
.mode strong{display:block;font-size:15px}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.day{display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;margin:0;line-height:1.05}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex.complete{background:var(--done-soft)}
.name{min-width:0;font-weight:600}
.alt{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.load{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kg{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.kg.reduced{color:var(--accent)}
.unit{font-size:12px;color:var(--muted);margin-left:2px}
.was{display:block;font-size:12px;color:var(--muted);text-decoration:line-through}
.scheme{display:block;font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.set{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);
  font-weight:600;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.rest{font-size:13px;color:var(--muted);margin:0}
.reset{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.notes{display:flex;flex-direction:column;gap:10px}
.notes h3{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;margin:6px 0 0}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.note b{display:block;margin-bottom:2px}
.tabs{grid-template-columns:repeat(5,1fr)}
.tab.prog{background:var(--accent-soft);border-color:transparent}
.tab.prog[aria-selected="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{font-size:22px}
.nav{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);line-height:1.1}
.cell.empty{background:none}
.cell.today{outline:2px solid var(--fg);outline-offset:-2px}
.cell.done{background:var(--done);color:var(--surface);font-weight:600}
.cell small{font-size:10px;opacity:.9;font-weight:600}
.legend{font-size:12px;color:var(--muted);margin:10px 0 0}
.history{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hrow:first-child{border-top:0}
.hrow span{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" data-lang="en">EN</button>
      <button id="lang-ru" data-lang="ru">RU</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="mode" id="modeBox">
    <label for="returnMode"><strong data-t="modeTitle"></strong><span data-t="modeText"></span></label>
    <input type="checkbox" class="switch" id="returnMode" checked>
  </div>

  <section id="day" aria-live="polite"></section>

  <section class="notes" id="notes"></section>
</div>

<script>
const T={
 en:{title:"Workouts",sub:"4-day split · goal 68–72 kg · Batumi",day:"Day",modeTitle:"Return week",
  modeText:"Weights about 15% below working weights. Turn on for the first week after a break.",
  progress:(d,t)=>`${d} of ${t} sets`,reset:"Clear today's checks",
  progTab:"Stats",progSmall:"calendar",progTitle:"Progress",thisWeek:"this week",thisMonth:"this month",allTime:"all time",
  months:["January","February","March","April","May","June","July","August","September","October","November","December"],
  wd:["Mo","Tu","We","Th","Fr","Sa","Su"],dShort:"D",
  legend:"A day turns green when you check at least one set. D1–D4 shows which workout.",
  history:"Recent workouts",none:"No workouts yet. Check a set on any day and it shows up here.",
  setsN:n=>`${n} ${n===1?"set":"sets"}`,locale:"en-GB",set:"set",kg:"kg",was:"kg",rules:"Rules",docTitle:"Nik's Workouts",
  notes:[["Progression","Each week add 1–2 reps or 2.5 kg. When you reach the top of the range in all sets, add weight and start again from the bottom."],
   ["Time","45–60 minutes. No need for more — keep it dense."],
   ["Cardio","Separate from the gym: walk 40–60 minutes on rest days, along the seafront. Intervals on the Assault Runner come back when the heel heals."],
   ["How you feel","Drink more water. Heart rate can be higher than usual at the same weight. If you feel slow in the morning, train closer to 17–19."],
   ["Creatine","5 g every day, after training with food. On rest days, with any meal."]]},
 ru:{title:"Тренировки",sub:"Сплит на 4 дня · цель 68–72 кг · Батуми",day:"День",modeTitle:"Неделя возвращения",
  modeText:"Веса на ~15% ниже рабочих. Включи на первую неделю после перерыва.",
  progress:(d,t)=>`${d} из ${t} подходов`,reset:"Сбросить отметки за сегодня",
  progTab:"Итоги",progSmall:"календарь",progTitle:"Прогресс",thisWeek:"на этой неделе",thisMonth:"в этом месяце",allTime:"всего",
  months:["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
  wd:["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],dShort:"Д",
  legend:"День становится зелёным, когда ты отметил хотя бы один подход. Д1–Д4 — какая тренировка.",
  history:"Последние тренировки",none:"Пока нет тренировок. Отметь подход в любом дне — он появится здесь.",
  setsN:n=>`${n} подх.`,locale:"ru-RU",set:"подход",kg:"кг",rules:"Правила",docTitle:"Тренировки Ника",
  notes:[["Прогрессия","Каждую неделю +1–2 повтора или +2,5 кг. Дошёл до верха диапазона во всех подходах — поднимай вес и начинай с нижней границы."],
   ["Время","45–60 минут. Больше не нужно, лучше плотнее."],
   ["Кардио","Отдельно от зала: ходьба 40–60 минут в дни отдыха, по набережной. Интервалы на Assault Runner — когда пятка заживёт."],
   ["Самочувствие","Пей больше воды. Пульс может быть выше обычного при том же весе. Если утром вялость — тренируйся ближе к 17–19."],
   ["Креатин","5 г каждый день, после тренировки с едой. В дни отдыха — с любым приёмом пищи."]]}
};
// [en, ru] pairs
const DAYS=[
 {id:"day1",short:["Push","Жим"],title:["Upper body — push","Верх тела — жим"],rest:["Rest 90 s, up to 2 min on bench press.","Отдых 90 сек, на жиме лёжа до 2 мин."],ex:[
  [["Barbell bench press","Жим штанги лёжа"],35,["4×8–10"],4],
  [["Lat pulldown to chest","Тяга верхнего блока к груди"],40,["4×10"],4],
  [["Machine shoulder press","Жим в тренажёре на плечи"],15,["3×10–12"],3,["per arm","на каждую руку"]],
  [["Seated cable row","Тяга нижнего блока (гребля)"],40,["3×12"],3],
  [["Dumbbell lateral raises","Махи гантелями в стороны"],7,["3×12–15"],3,["7 kg dumbbells","гантели по 7 кг"]],
  [["Cable triceps pushdown","Трицепс на блоке"],68,["3×12"],3],
  [["Cable biceps curl","Бицепс на блоке"],50,["3×12"],3]]},
 {id:"day2",short:["Legs","Ноги"],title:["Lower body","Низ тела"],rest:["Rest 90 s, up to 2 min on squats.","Отдых 90 сек, на приседе до 2 мин."],ex:[
  [["Squat (barbell or Smith)","Присед (штанга или Смит)"],40,["4×8–10"],4],
  [["Smith Romanian deadlift","Румынская тяга в Смите"],45,["4×10"],4],
  [["Leg press","Жим ногами"],45,["3×12"],3],
  [["Lying leg curl","Сгибание ног лёжа"],25,["3×12"],3],
  [["Leg extension","Разгибание ног"],30,["3×12"],3],
  [["Standing calf raises","Икры стоя"],40,["3×15–20"],3]]},
 {id:"day3",short:["Pull","Тяга"],title:["Upper body — pull","Верх тела — тяга"],rest:["Rest 90 s.","Отдых 90 сек."],ex:[
  [["Assisted pull-up / reverse-grip pulldown","Гравитрон / тяга блока обратным хватом"],45,["4×8–10"],4],
  [["Incline dumbbell press","Жим гантелей на наклонной"],15,["4×10"],4,["or Smith incline press","или жим в Смите на наклонной скамье"]],
  [["One-arm dumbbell row","Тяга гантели в наклоне"],20,["3×10 per arm","3×10 на руку"],3],
  [["Pec deck / machine fly","Бабочка / разведения в тренажёре"],20,["3×12"],3],
  [["Cable or machine biceps curl","Бицепс на блоке или в тренажёре"],10,["3×12"],3],
  [["Plank / leg raises","Планка / подъём ног"],null,["3×40–60 s","3×40–60 сек"],3]]},
 {id:"day4",short:["Legs+","Ноги+"],title:["Legs + conditioning","Ноги + кондиция"],rest:["Rest 60–90 s.","Отдых 60–90 сек."],ex:[
  [["Leg press","Жим ногами"],40,["4×12"],4],
  [["Back extension","Гиперэкстензия"],7.5,["3×12–15"],3,["with a plate","с блином"]],
  [["Bulgarian split squat / glute bridge","Болгарские приседы / ягодичный мост"],12.5,["3×12"],3,["Bulgarian only if the foot is ok","болгарские — если нога ок"]],
  [["Hip adduction machine","Сведение бедра в тренажёре"],40,["3×15"],3],
  [["Hip abduction machine","Разведение бедра в тренажёре"],35,["3×15"],3],
  [["Abs: crunches + leg raises","Пресс: скручивания + подъём ног"],null,["3×15"],3],
  [["Elliptical or bike","Эллипс или велотренажёр"],null,["20 min steady","20 мин ровно"],1,["at the end of the session","в конце тренировки"]]]}
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang","en"); if(!T[lang]) lang="en";
const L=()=>lang==="ru"?1:0;
const pick=a=>a?(a[L()]??a[0]):"";
const fmt=n=>{const s=String(Math.round(n*10)/10);return lang==="ru"?s.replace(".",","):s};
function reduce(w){const r=w*0.85;return w<=12.5?Math.max(1,Math.round(r)):Math.round(r/2.5)*2.5}
// Dates are local "YYYY-MM-DD"
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>iso(new Date());
// log: { "2026-10-21": { "day1": 5 } } — sets checked per workout per date
function getLog(){return store.get("log",{})}
function setLogCount(date,dayId,n){const log=getLog();log[date]=log[date]||{};
  if(n>0)log[date][dayId]=n;else delete log[date][dayId];
  if(!Object.keys(log[date]).length)delete log[date];store.set("log",log)}
// checks for a workout belong to one date; on a new date they start empty
function getChecks(dayId){const raw=store.get("checks-"+dayId,null);
  if(!raw)return {};
  if(!raw.date){ // old format from before the calendar: count it as today
    const n=Object.values(raw).flat().filter(Boolean).length;
    const migrated={date:today(),sets:raw};store.set("checks-"+dayId,migrated);
    if(n)setLogCount(today(),dayId,n);return raw}
  return raw.date===today()?raw.sets||{}:{}}
function saveChecks(dayId,sets){store.set("checks-"+dayId,{date:today(),sets});
  setLogCount(today(),dayId,Object.values(sets).flat().filter(Boolean).length)}
DAYS.forEach(d=>getChecks(d.id));

const VIEWS=[...DAYS.map(d=>d.id),"progress"];
let current=(location.hash||"").slice(1);
if(!VIEWS.includes(current))current=store.get("day","day1");
if(!VIEWS.includes(current))current="day1";
let calMonth=(()=>{const n=new Date();return {y:n.getFullYear(),m:n.getMonth()}})();
const modeEl=document.getElementById("returnMode");
modeEl.checked=store.get("returnMode",true);
modeEl.addEventListener("change",()=>{store.set("returnMode",modeEl.checked);render()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("lang",lang);renderAll()});

function renderStatic(){
  const t=T[lang];
  document.documentElement.lang=lang;document.title=t.docTitle;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("notes").innerHTML=`<h3>${t.rules}</h3>`+t.notes.map(([h,p])=>`<div class="note"><b>${h}</b>${p}</div>`).join("");
}
function go(v){current=v;store.set("day",current);renderTabs();render()}
function renderTabs(){
  const t=document.getElementById("tabs");t.innerHTML="";
  DAYS.forEach((d,i)=>{const b=document.createElement("button");b.className="tab";b.id="tab-"+d.id;
    b.setAttribute("role","tab");b.setAttribute("aria-selected",d.id===current);
    b.innerHTML=`${T[lang].day} ${i+1}<small>${pick(d.short)}</small>`;b.onclick=()=>go(d.id);t.appendChild(b)});
  const p=document.createElement("button");p.className="tab prog";p.id="tab-progress";
  p.setAttribute("role","tab");p.setAttribute("aria-selected",current==="progress");
  p.innerHTML=`${T[lang].progTab}<small>${T[lang].progSmall}</small>`;p.onclick=()=>go("progress");t.appendChild(p);
}
function render(){
  document.getElementById("modeBox").hidden=current==="progress";
  document.getElementById("notes").hidden=current==="progress";
  if(current==="progress")return renderProgress();
  const t=T[lang],d=DAYS.find(x=>x.id===current),i=DAYS.indexOf(d),reduced=modeEl.checked;
  const checks=getChecks(d.id);
  let done=0,total=0;
  const rows=d.ex.map((e,k)=>{const [nm,w,sc,n,al]=e;const name=pick(nm),scheme=pick(sc),alt=pick(al);const c=checks[k]||[];
    total+=n;const cnt=c.filter(Boolean).length;done+=cnt;
    let load="";
    if(w!==null){const shown=reduced?reduce(w):w,chg=reduced&&shown!==w;
      load=`<span class="kg${chg?" reduced":""}">${fmt(shown)}<span class="unit">${t.kg}</span></span>${chg?`<span class="was">${fmt(w)} ${t.kg}</span>`:""}`}
    const sets=Array.from({length:n},(_,s)=>`<button class="set" data-ex="${k}" data-set="${s}" aria-pressed="${!!c[s]}" aria-label="${name}, ${t.set} ${s+1}">${s+1}</button>`).join("");
    return `<div class="ex${cnt===n?" complete":""}"><div class="name">${name}${alt?`<span class="alt">${alt}</span>`:""}<span class="scheme">${scheme}</span></div><div class="load">${load}</div><div class="sets">${sets}</div></div>`}).join("");
  document.getElementById("day").innerHTML=`<div class="day">
    <div class="dayhead"><h2>${t.day} ${i+1}. ${pick(d.title)}</h2><span class="progress">${t.progress(done,total)}</span></div>
    <p class="rest">${pick(d.rest)}</p>
    <div class="list">${rows}</div>
    <button class="reset" id="reset">${t.reset}</button></div>`;
  document.querySelectorAll(".set").forEach(b=>b.onclick=()=>{
    const ch=getChecks(d.id);const k=b.dataset.ex,s=+b.dataset.set;
    ch[k]=ch[k]||[];ch[k][s]=!ch[k][s];saveChecks(d.id,ch);render()});
  document.getElementById("reset").onclick=()=>{saveChecks(d.id,{});render()};
}
function renderProgress(){
  const t=T[lang],log=getLog(),dates=Object.keys(log).sort();
  const now=new Date(),todayIso=today();
  const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const monIso=iso(monday);
  const monthPrefix=todayIso.slice(0,7);
  const week=dates.filter(x=>x>=monIso&&x<=todayIso).length;
  const month=dates.filter(x=>x.startsWith(monthPrefix)).length;
  const {y,m}=calMonth;
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7;
  let cells=t.wd.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<lead;i++)cells+=`<div class="cell empty"></div>`;
  for(let dn=1;dn<=days;dn++){const key=iso(new Date(y,m,dn)),e=log[key];
    const tag=e?Object.keys(e).map(id=>t.dShort+(DAYS.findIndex(x=>x.id===id)+1)).join(" "):"";
    cells+=`<div class="cell${e?" done":""}${key===todayIso?" today":""}">${dn}${tag?`<small>${tag}</small>`:""}</div>`}
  const fmtDate=k=>{const [yy,mm,dd]=k.split("-").map(Number);return new Date(yy,mm-1,dd).toLocaleDateString(t.locale,{weekday:"short",day:"numeric",month:"short"})};
  const hist=dates.slice(-8).reverse().map(k=>{const e=log[k];
    const what=Object.entries(e).map(([id,n])=>{const d=DAYS.find(x=>x.id===id);return `${t.day} ${DAYS.indexOf(d)+1} · ${pick(d.short)} · ${t.setsN(n)}`}).join("; ");
    return `<div class="hrow"><b>${fmtDate(k)}</b><span>${what}</span></div>`}).join("");
  document.getElementById("day").innerHTML=`<div class="day">
    <div class="dayhead"><h2>${t.progTitle}</h2></div>
    <div class="stats">
      <div class="stat"><b>${week}</b><span>${t.thisWeek}</span></div>
      <div class="stat"><b>${month}</b><span>${t.thisMonth}</span></div>
      <div class="stat"><b>${dates.length}</b><span>${t.allTime}</span></div>
    </div>
    <div class="cal">
      <div class="calhead"><button class="nav" id="prevM" aria-label="‹">‹</button><h2>${t.months[m]} ${y}</h2><button class="nav" id="nextM" aria-label="›">›</button></div>
      <div class="grid">${cells}</div>
      <p class="legend">${t.legend}</p>
    </div>
    <h3 style="font-family:var(--display);font-size:20px;text-transform:uppercase;margin:6px 0 0">${t.history}</h3>
    <div class="list history">${hist||`<div class="hrow"><span>${t.none}</span></div>`}</div>
  </div>`;
  document.getElementById("prevM").onclick=()=>{calMonth=m===0?{y:y-1,m:11}:{y,m:m-1};render()};
  document.getElementById("nextM").onclick=()=>{calMonth=m===11?{y:y+1,m:0}:{y,m:m+1};render()};
}
function renderAll(){renderStatic();renderTabs();render()}
renderAll();
</script>
</body>
</html>
